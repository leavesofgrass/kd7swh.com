# Build and deploy kd7swh.com. The site is built by the SAME Dockerfile as
# local dev — CI does not reimplement the build with setup-node and hope it
# matches. Same stages, same lockfile, same digest-pinned base image.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build site (artifact stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifact
          outputs: type=local,dest=_site
          # No provenance attestation: it writes provenance.json into the
          # local output, which would get deployed with the site.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build toolchain image (for guard)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: kd7swh-toolchain:ci
          cache-from: type=gha
      - name: Guard — leakage and shape checks
        run: docker run --rm -v "$PWD:/site" kd7swh-toolchain:ci node tools/guard.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Deploys run ONLY from main.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
