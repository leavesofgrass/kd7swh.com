# PR checks: build, guard, link check. No deploy, no secrets in scope.
#
# This uses `pull_request`, NEVER `pull_request_target`. A public repo
# taking fork PRs is exactly where that distinction bites:
# pull_request_target runs with repository secrets against untrusted code.
name: pr

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build site (artifact stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifact
          outputs: type=local,dest=_site
          cache-from: type=gha
      - name: Build toolchain image (for guard)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: kd7swh-toolchain:ci
          cache-from: type=gha
      - name: Guard — leakage and shape checks
        run: docker run --rm -v "$PWD:/site" kd7swh-toolchain:ci node tools/guard.mjs
      - name: Unit tests — publish.mjs
        run: docker run --rm -v "$PWD:/site" kd7swh-toolchain:ci node tools/publish.test.mjs
      - name: Link check — every link on /lun/ resolves
        run: >
          docker run --rm -v "$PWD/_site:/data:ro"
          lycheeverse/lychee:latest@sha256:eaff3e0a13603c9a701accfcc84f44158bb77bf36ecfa4622b626056c3463892
          --no-progress --max-concurrency 8 --root-dir /data
          --accept 200,206,301,302,403
          /data/lun/index.html
