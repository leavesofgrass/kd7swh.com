name: kd7swh

# No service mounts anything outside this folder. Not read-only, not narrowly
# scoped — nothing. The weekly candidate list lives in ./drafts, which is part
# of this project and is gitignored. Nothing else on the host is ever involved.
#
# If a future change appears to require mounting a path from outside this
# directory, stop and reconsider. That is the invariant.

services:

  # Dev server with live reload. http://localhost:8080
  dev:
    build:
      context: .
      target: dev
    volumes:
      - .:/site
      # Named volume, not a bind mount. node_modules lives in the Linux VM's
      # filesystem instead of crossing the Windows boundary on every read.
      - node_modules:/site/node_modules
    ports:
      - "8080:8080"

  # One-shot production build into ./_site
  build:
    build:
      context: .
      target: dev
    volumes:
      - .:/site
      - node_modules:/site/node_modules
    environment:
      NODE_ENV: production
    command: ["npx", "@11ty/eleventy"]

  # ./drafts/YYYY-MM-DD.md  ->  ./content/lun/YYYY-MM-DD.md
  # Reads only checked [x] items; everything else is ignored by construction.
  publish:
    build:
      context: .
      target: dev
    volumes:
      - .:/site
      - node_modules:/site/node_modules
    command: ["node", "tools/publish.mjs"]

  # Leakage and shape checks before publishing.
  guard:
    build:
      context: .
      target: dev
    volumes:
      - .:/site
      - node_modules:/site/node_modules
    command: ["node", "tools/guard.mjs"]

  # Link checker. Run against the built site before the 7:00 PM checkpoint.
  # Digest-pinned (read from `docker buildx imagetools inspect` 2026-08-08).
  links:
    image: lycheeverse/lychee:latest@sha256:eaff3e0a13603c9a701accfcc84f44158bb77bf36ecfa4622b626056c3463892
    volumes:
      - ./_site:/data:ro
      # Known-dead archive links, committed at the repo root.
      - ./.lycheeignore:/ignore:ro
    command:
      - "--no-progress"
      - "--max-concurrency"
      - "8"
      - "--root-dir"
      - "/data"
      - "--exclude-file"
      - "/ignore"
      # Self-origin absolute URLs (the feeds' entry links) point at pages
      # that only exist after this very build deploys — skip them; the
      # same pages are checked as files via --root-dir.
      - "--exclude"
      - '^https://kd7swh\.com'
      - "--accept"
      - "200,206,301,302,403"
      - "/data"

volumes:
  node_modules:
